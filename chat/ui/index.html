<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intact Chat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #f6f7f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: min(860px, 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .status {
      min-width: 92px;
      text-align: right;
      font-size: 14px;
      color: #666;
    }

    .messages {
      min-height: 420px;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      padding: 16px;
      background: #fff;
      border: 1px solid #dedede;
      border-radius: 8px;
    }

    .message {
      width: fit-content;
      max-width: min(720px, 100%);
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .user {
      margin-left: auto;
      background: #1f2937;
      color: #fff;
    }

    .assistant {
      background: #eef1f5;
      color: #171717;
    }

    .citation {
      min-width: 0;
      margin: 0 2px;
      padding: 1px 5px;
      border: 1px solid #9db7e8;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font: inherit;
      font-size: 0.9em;
      font-weight: 700;
      cursor: pointer;
      vertical-align: baseline;
    }

    .citation:disabled {
      color: #667085;
      background: #e5e7eb;
      border-color: #d1d5db;
      cursor: wait;
    }

    .chunks {
      width: min(720px, 100%);
      margin: 0 0 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .chunks h2 {
      margin: 0;
      color: #666;
      font-size: 13px;
      font-weight: 650;
    }

    .chunk {
      display: inline-flex;
      align-items: center;
      max-width: 230px;
      padding: 7px 10px;
      border: 1px solid #cfd7e3;
      border-radius: 999px;
      background: #eef4ff;
      color: #1f3f75;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgb(0 0 0 / 35%);
    }

    .popover {
      width: min(680px, 100%);
      max-height: min(520px, 90vh);
      overflow: auto;
      padding: 18px;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 60px rgb(0 0 0 / 25%);
    }

    .popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .popover-title {
      margin: 0;
      font-size: 16px;
    }

    .popover-close {
      min-width: 0;
      padding: 6px 10px;
      background: #1f2937;
    }

    .popover-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }

    button {
      min-width: 96px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 650;
      color: #fff;
      background: #2563eb;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      background: #9aa8bd;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 10px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        text-align: left;
      }

      form {
        grid-template-columns: 1fr;
      }

      button {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Intact Chat</h1>
      <div id="status" class="status">Ready</div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="chat-form">
      <textarea id="question" name="question" placeholder="Ask a question..." autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    function addMessage(text, role) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.textContent = text;
      node.chunks = new Map();
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
      return node;
    }

    function renderAnswer(answer, text) {
      answer.textContent = "";
      const citationPattern = /<doc(\d+)>/g;
      let cursor = 0;
      let match;

      while ((match = citationPattern.exec(text)) !== null) {
        if (match.index > cursor) {
          answer.appendChild(document.createTextNode(text.slice(cursor, match.index)));
        }

        const index = Number(match[1]);
        const citation = document.createElement("button");
        citation.className = "citation";
        citation.type = "button";
        citation.textContent = `[${index}]`;
        citation.dataset.index = String(index);
        citation.disabled = !answer.chunks.has(index);
        citation.addEventListener("click", () => showChunk(index, answer.chunks));
        answer.appendChild(citation);

        cursor = match.index + match[0].length;
      }

      if (cursor < text.length) {
        answer.appendChild(document.createTextNode(text.slice(cursor)));
      }
    }

    function refreshCitations(answer) {
      answer.querySelectorAll(".citation").forEach((citation) => {
        citation.disabled = !answer.chunks.has(Number(citation.dataset.index));
      });
    }

    function showChunk(index, chunks) {
      const chunk = chunks.get(index);
      if (!chunk) {
        return;
      }

      const source = chunk.metadata?.document?.split("/").pop() || "source";
      const backdrop = document.createElement("div");
      backdrop.className = "popover-backdrop";

      const popover = document.createElement("section");
      popover.className = "popover";

      const header = document.createElement("div");
      header.className = "popover-header";

      const title = document.createElement("h2");
      title.className = "popover-title";
      title.textContent = `Chunk ${chunk.index} - ${source}`;

      const close = document.createElement("button");
      close.className = "popover-close";
      close.type = "button";
      close.textContent = "Close";
      close.addEventListener("click", () => backdrop.remove());

      const text = document.createElement("p");
      text.className = "popover-text";
      text.textContent = chunk.text;

      header.appendChild(title);
      header.appendChild(close);
      popover.appendChild(header);
      popover.appendChild(text);
      backdrop.appendChild(popover);
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) {
          backdrop.remove();
        }
      });

      document.body.appendChild(backdrop);
    }

    function addChunks(chunks, answer) {
      answer.chunks = new Map(chunks.map((chunk) => [Number(chunk.index), chunk]));
      refreshCitations(answer);

      const panel = document.createElement("section");
      panel.className = "chunks";

      const title = document.createElement("h2");
      title.textContent = "Retrieved chunks";
      panel.appendChild(title);

      chunks.forEach((chunk) => {
        const item = document.createElement("button");
        const source = chunk.metadata?.document?.split("/").pop() || "source";
        item.className = "chunk";
        item.type = "button";
        item.textContent = `#${chunk.index} ${source}`;
        item.setAttribute("aria-label", `Retrieved chunk ${chunk.index} from ${source}`);
        item.addEventListener("click", () => showChunk(Number(chunk.index), answer.chunks));
        panel.appendChild(item);
      });

      messages.appendChild(panel);
      messages.scrollTop = messages.scrollHeight;
    }

    function handleEvent(eventName, payload, answer) {
      if (eventName === "answer_delta") {
        answer.dataset.rawText = `${answer.dataset.rawText || ""}${payload.content || ""}`;
        renderAnswer(answer, answer.dataset.rawText);
      }

      if (eventName === "chunks") {
        addChunks(payload.chunks || [], answer);
      }

      messages.scrollTop = messages.scrollHeight;
    }

    function parseEventBlock(block, answer) {
      const lines = block.split("\n");
      const eventLine = lines.find((line) => line.startsWith("event: "));
      const dataLines = lines
        .filter((line) => line.startsWith("data: "))
        .map((line) => line.slice("data: ".length));

      if (!eventLine || !dataLines.length) {
        return;
      }

      const eventName = eventLine.slice("event: ".length);
      const payload = JSON.parse(dataLines.join("\n"));
      handleEvent(eventName, payload, answer);
    }

    function setBusy(isBusy) {
      send.disabled = isBusy;
      input.disabled = isBusy;
      status.textContent = isBusy ? "Streaming" : "Ready";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) {
        input.focus();
        return;
      }

      addMessage(question, "user");
      input.value = "";
      const answer = addMessage("", "assistant");
      setBusy(true);

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question}),
        });

        if (!response.ok || !response.body) {
          const detail = await response.text();
          throw new Error(detail || `Request failed with ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const {value, done} = await reader.read();
          if (done) {
            break;
          }

          buffer += decoder.decode(value, {stream: true});
          const blocks = buffer.split("\n\n");
          buffer = blocks.pop() || "";

          blocks.forEach((block) => parseEventBlock(block, answer));
        }

        if (buffer.trim()) {
          parseEventBlock(buffer, answer);
        }
      } catch (error) {
        answer.textContent = `Error: ${error.message}`;
        status.textContent = "Error";
      } finally {
        setBusy(false);
        input.focus();
      }
    });
  </script>
</body>
</html>
