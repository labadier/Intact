<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intact Chat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #10231a;
      background: #f3f8f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: min(860px, 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #0f5c38;
    }

    .status {
      min-width: 92px;
      text-align: right;
      font-size: 14px;
      color: #4f6f5c;
    }

    .messages {
      min-height: 420px;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      padding: 16px;
      background: #fbfdfb;
      border: 1px solid #cfe3d5;
      border-radius: 8px;
    }

    .message {
      width: fit-content;
      max-width: min(720px, 100%);
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .user {
      margin-left: auto;
      background: #0f5c38;
      color: #fff;
    }

    .assistant {
      background: #e7f3ea;
      color: #10231a;
    }

    .searching {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #50725d;
      font-weight: 500;
    }

    .loader {
      width: 14px;
      height: 14px;
      border: 2px solid #c8dccd;
      border-top-color: #2f7d4f;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .citation {
      min-width: 0;
      margin: 0 2px;
      padding: 1px 5px;
      border: 1px solid #8fc9a4;
      border-radius: 999px;
      background: #dff3e6;
      color: #0f6b3f;
      font: inherit;
      font-size: 0.9em;
      font-weight: 700;
      cursor: pointer;
      vertical-align: baseline;
    }

    .citation:disabled {
      color: #6f8175;
      background: #e7eee9;
      border-color: #d4ded7;
      cursor: wait;
    }

    .citation:hover:not(:disabled) {
      background: #c8ebd4;
      color: #0b5632;
    }

    .chunks {
      width: min(720px, 100%);
      margin: 0 0 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .chunks h2 {
      margin: 0;
      color: #4f6f5c;
      font-size: 13px;
      font-weight: 650;
    }

    .chunk {
      display: inline-flex;
      align-items: center;
      max-width: 230px;
      padding: 7px 10px;
      border: 1px solid #a9d3b8;
      border-radius: 999px;
      background: #edf8f0;
      color: #145c39;
      font-size: 12px;
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chunk:hover:not(:disabled) {
      background: #d8f0df;
      color: #0f4d30;
    }

    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgb(0 0 0 / 35%);
    }

    .popover {
      width: min(680px, 100%);
      max-height: min(520px, 90vh);
      overflow: auto;
      padding: 18px;
      border-radius: 8px;
      background: #fbfdfb;
      box-shadow: 0 18px 60px rgb(14 73 44 / 22%);
    }

    .popover-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .popover-title {
      margin: 0;
      font-size: 16px;
    }

    .popover-close {
      min-width: 0;
      padding: 6px 10px;
      background: #0f5c38;
    }

    .popover-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #bdd9c5;
      border-radius: 8px;
      font: inherit;
      background: #fbfdfb;
      color: #10231a;
    }

    textarea:focus {
      outline: 2px solid #8fc9a4;
      outline-offset: 2px;
    }

    textarea::placeholder {
      color: #789985;
    }

    button {
      min-width: 96px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 650;
      color: #fff;
      background: #16824f;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #0f6b3f;
    }

    button:disabled {
      cursor: not-allowed;
      background: #9bb7a4;
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 10px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .status {
        text-align: left;
      }

      form {
        grid-template-columns: 1fr;
      }

      button {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Intact Chat</h1>
      <div id="status" class="status">Ready</div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="chat-form">
      <textarea id="question" name="question" placeholder="Ask a question..." autocomplete="off"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    function addMessage(text, role) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.textContent = text;
      node.chunks = new Map();
      messages.appendChild(node);
      messages.scrollTop = messages.scrollHeight;
      return node;
    }

    function addSearchingMessage() {
      const node = addMessage("", "assistant");
      const label = document.createElement("span");
      const loader = document.createElement("span");

      label.className = "searching";
      loader.className = "loader";
      loader.setAttribute("aria-hidden", "true");
      label.textContent = "Searching for data";
      label.appendChild(loader);
      node.appendChild(label);

      return node;
    }

    function citationIndexes(reference) {
      return [...reference.matchAll(/(?:doc)?(\d+)/g)].map((item) => Number(item[1]));
    }

    function referencedChunkIndexes(text) {
      const citationPattern = /<doc\d+(?:\s*,\s*(?:doc)?\d+)*>/g;
      return new Set(
        [...text.matchAll(citationPattern)].flatMap((match) => citationIndexes(match[0])),
      );
    }

    function renderAnswer(answer, text) {
      answer.textContent = "";
      const citationPattern = /<doc\d+(?:\s*,\s*(?:doc)?\d+)*>/g;
      let cursor = 0;
      let match;

      while ((match = citationPattern.exec(text)) !== null) {
        if (match.index > cursor) {
          answer.appendChild(document.createTextNode(text.slice(cursor, match.index)));
        }

        const indexes = citationIndexes(match[0]);
        indexes.forEach((index, citationIndex) => {
          if (citationIndex > 0) {
            answer.appendChild(document.createTextNode(" "));
          }

          const citation = document.createElement("button");
          citation.className = "citation";
          citation.type = "button";
          citation.textContent = `[${index}]`;
          citation.dataset.index = String(index);
          citation.disabled = !answer.chunks.has(index);
          citation.addEventListener("click", () => showChunk(index, answer.chunks));
          answer.appendChild(citation);
        });

        cursor = match.index + match[0].length;
      }

      if (cursor < text.length) {
        answer.appendChild(document.createTextNode(text.slice(cursor)));
      }
    }

    function refreshCitations(answer) {
      answer.querySelectorAll(".citation").forEach((citation) => {
        citation.disabled = !answer.chunks.has(Number(citation.dataset.index));
      });
    }

    function closePopover() {
      document.querySelector(".popover-backdrop")?.remove();
    }

    function showChunk(index, chunks) {
      const chunk = chunks.get(index);
      if (!chunk) {
        return;
      }

      closePopover();

      const source = chunk.metadata?.document?.split("/").pop() || "source";
      const backdrop = document.createElement("div");
      backdrop.className = "popover-backdrop";

      const popover = document.createElement("section");
      popover.className = "popover";

      const header = document.createElement("div");
      header.className = "popover-header";

      const title = document.createElement("h2");
      title.className = "popover-title";
      title.textContent = `Chunk ${chunk.index} - ${source}`;

      const close = document.createElement("button");
      close.className = "popover-close";
      close.type = "button";
      close.textContent = "Close";
      close.addEventListener("click", closePopover);

      const text = document.createElement("p");
      text.className = "popover-text";
      text.textContent = chunk.text;

      header.appendChild(title);
      header.appendChild(close);
      popover.appendChild(header);
      popover.appendChild(text);
      backdrop.appendChild(popover);
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) {
          closePopover();
        }
      });

      document.body.appendChild(backdrop);
    }

    function addChunks(chunks, answer) {
      answer.chunks = new Map(chunks.map((chunk) => [Number(chunk.index), chunk]));
      refreshCitations(answer);

      const referencedIndexes = referencedChunkIndexes(answer.dataset.rawText || "");
      const referencedChunks = chunks.filter((chunk) => referencedIndexes.has(Number(chunk.index)));
      if (!referencedChunks.length) {
        return;
      }

      const panel = document.createElement("section");
      panel.className = "chunks";

      const title = document.createElement("h2");
      title.textContent = "Supporting Information";
      panel.appendChild(title);

      referencedChunks.forEach((chunk) => {
        const item = document.createElement("button");
        const source = chunk.metadata?.document?.split("/").pop() || "source";
        item.className = "chunk";
        item.type = "button";
        item.textContent = `#${chunk.index} ${source}`;
        item.setAttribute("aria-label", `Supporting Information ${chunk.index} from ${source}`);
        item.addEventListener("click", () => showChunk(Number(chunk.index), answer.chunks));
        panel.appendChild(item);
      });

      messages.appendChild(panel);
      messages.scrollTop = messages.scrollHeight;
    }

    function handleEvent(eventName, payload, answer) {
      if (eventName === "answer_delta") {
        if (!answer.dataset.started) {
          answer.dataset.started = "true";
          answer.dataset.rawText = "";
          status.textContent = "Streaming";
        }

        answer.dataset.rawText = `${answer.dataset.rawText || ""}${payload.content || ""}`;
        renderAnswer(answer, answer.dataset.rawText);
      }

      if (eventName === "chunks") {
        addChunks(payload.chunks || [], answer);
      }

      if (eventName === "error") {
        answer.textContent = `Error: ${payload.message || "The response stream failed."}`;
        status.textContent = "Error";
      }

      messages.scrollTop = messages.scrollHeight;
    }

    function parseEventBlock(block, answer) {
      const lines = block.split("\n");
      const eventLine = lines.find((line) => line.startsWith("event: "));
      const dataLines = lines
        .filter((line) => line.startsWith("data: "))
        .map((line) => line.slice("data: ".length));

      if (!eventLine || !dataLines.length) {
        return;
      }

      const eventName = eventLine.slice("event: ".length);
      const payload = JSON.parse(dataLines.join("\n"));
      handleEvent(eventName, payload, answer);
    }

    function setBusy(isBusy) {
      send.disabled = isBusy;
      input.disabled = isBusy;
      status.textContent = isBusy ? "Working" : "Ready";
    }

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closePopover();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) {
        input.focus();
        return;
      }

      addMessage(question, "user");
      input.value = "";
      const answer = addSearchingMessage();
      setBusy(true);
      status.textContent = "Searching";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question}),
        });

        if (!response.ok || !response.body) {
          const detail = await response.text();
          throw new Error(detail || `Request failed with ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const {value, done} = await reader.read();
          if (done) {
            break;
          }

          buffer += decoder.decode(value, {stream: true});
          const blocks = buffer.split("\n\n");
          buffer = blocks.pop() || "";

          blocks.forEach((block) => parseEventBlock(block, answer));
        }

        if (buffer.trim()) {
          parseEventBlock(buffer, answer);
        }
      } catch (error) {
        answer.textContent = `Error: ${error.message}`;
        status.textContent = "Error";
      } finally {
        setBusy(false);
        input.focus();
      }
    });
  </script>
</body>
</html>
