name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  CUDA_VISIBLE_DEVICES: "-1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Check formatting
        run: uv run ruff format --check --diff .

      - name: Run Ruff
        run: uv run ruff check .

  dvc:
    name: DVC status
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Configure SSH for DVC remote
        env:
          DVC_SSH_PRIVATE_KEY: ${{ secrets.DVC_SSH_PRIVATE_KEY }}
          DVC_SSH_PASSPHRASE: ${{ secrets.DVC_SSH_PASSPHRASE }}
          DVC_SSH_KNOWN_HOSTS: ${{ secrets.DVC_SSH_KNOWN_HOSTS }}
          DVC_SSH_HOST: ${{ secrets.DVC_SSH_HOST }}
        run: |
          test -n "$DVC_SSH_PRIVATE_KEY" || (echo "Missing DVC_SSH_PRIVATE_KEY secret"; exit 1)

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DVC_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$DVC_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DVC_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          elif [ -n "$DVC_SSH_HOST" ]; then
            ssh-keyscan -H "$DVC_SSH_HOST" >> ~/.ssh/known_hosts
          else
            echo "Missing DVC_SSH_KNOWN_HOSTS or DVC_SSH_HOST secret"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          if [ -n "$DVC_SSH_PASSPHRASE" ]; then
            cat > /tmp/ssh-askpass <<'EOF'
          #!/bin/sh
          printf '%s\n' "$DVC_SSH_PASSPHRASE"
          EOF
            chmod 700 /tmp/ssh-askpass

            DISPLAY=:0 \
            SSH_ASKPASS=/tmp/ssh-askpass \
            SSH_ASKPASS_REQUIRE=force \
            DVC_SSH_PASSPHRASE="$DVC_SSH_PASSPHRASE" \
            setsid ssh-add ~/.ssh/id_ed25519 </dev/null
          else
            if ssh-keygen -y -P "" -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
              ssh-add ~/.ssh/id_ed25519 </dev/null
            else
              echo "The DVC SSH key is encrypted, but DVC_SSH_PASSPHRASE is empty."
              exit 1
            fi
          fi

          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Pull DVC data
        run: uv run dvc pull

      - name: Check DVC pipeline status
        run: |
          uv run dvc status > dvc_status.txt
          grep -q "Data and pipelines are up to date." dvc_status.txt || (cat dvc_status.txt; exit 1)

      - name: Upload DVC status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvc-status
          path: dvc_status.txt
          retention-days: 7

      - name: Upload DVC outputs
        uses: actions/upload-artifact@v4
        with:
          name: dvc-output
          path: output/
          retention-days: 1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run tests
        run: >
          uv run python -m pytest
          --maxfail=1
          --cov=chat
          --cov=models
          --cov=scripts
          --junitxml=report.xml
          tests/
          -rxXs

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: report.xml
          retention-days: 7

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - lint
      - dvc
      - unit-tests
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DVC outputs
        uses: actions/download-artifact@v4
        with:
          name: dvc-output
          path: output

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
