[project]
name = "intact"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dvc>=3.67.1",
    "dvc-ssh>=4.3.0",
    "fastapi>=0.136.3",
    "fire>=0.7.1",
    "ipykernel>=7.2.0",
    "langchain>=1.3.2",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "openai>=2.40.0",
    "pdfminer-six>=20260107",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.5.1",
    "unstructured[pdf]>=0.22.31",
]

[dependency-groups]
dev = [
    "dvc-ssh>=4.3.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
include = ["chat/**/*.py", "models/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
target-version = "py311"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "E",   # flake8
    "F",   # pyflakes
    "I",   # isort
    "C90", # mccabe
    "D",   # pydocstyle
    "ANN", # type annotations
    "S",   # bandit
    "EXE", # flake8 executable
    "PTH", # use pathlib
    "RUF", # ruff rules
]
ignore = [
    "E501",   # line length
    "D100",   # module docstring
    "D104",   # missing docstring in public package
    "D203",   # blank line required before class
    "D211",   # no blank line before class
    "D213",   # multi line summary second line
    "ANN003", # **kwargs annotation
    "ANN204", # missing return type for __init__
    "PTH123", # path.open
]
unfixable = [
    "F401", # Prevent stripping of unknown imports
    "F841", # Prevent stripping of unknown variables
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",      # Docstrings
    "S101",   # Allow asserts
    "ANN201", # Return type annotation
]

[tool.pytest.ini_options]
pythonpath = ["."]
